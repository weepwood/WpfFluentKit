name: Windows Gallery
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore samples/WpfFluentKit.Gallery/WpfFluentKit.Gallery.csproj
      - name: Build
        run: dotnet build samples/WpfFluentKit.Gallery/WpfFluentKit.Gallery.csproj --configuration Release --no-restore
      - name: Publish (win-x64)
        run: dotnet publish samples/WpfFluentKit.Gallery/WpfFluentKit.Gallery.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: WpfFluentKit-Gallery-win-x64
          path: dist/**
          if-no-files-found: error
          retention-days: 30